<body style="height: 100%; padding: 0; margin: 0">

<div class="d-flex flex-column" style="width: 100%; height: 100%;">

<nav class="navbar navbar-expand-sm bg-body-tertiary">
  <div class="container-fluid">
    <a class="navbar-brand">3D Viewer</a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarSupportedContent" aria-controls="navbarSupportedContent" aria-expanded="false" aria-label="Toggle navigation">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="navbarSupportedContent">
      <ul class="navbar-nav me-auto mb-2 mb-lg-0">
        <li class="nav-item"><a class="nav-link" data-toggle="modal" data-target="#settings_modal" href="#">Settings</a></li>
        <li class="nav-item"><a class="nav-link" data-toggle="modal" data-target="#map_modal" href="#">Map</a></li>
        <li class="nav-item dropdown">
          <a class="nav-link dropdown-toggle" role="button" data-bs-toggle="dropdown" aria-expanded="false">Model</a>
          <ul class="dropdown-menu w-100">
            <li><a class="dropdown-item" href="#">Mount Rainier</a></li>
            <li><a class="dropdown-item" href="#">Mount St. Helens</a></li>
            <li><a class="dropdown-item" href="#">Zion Canyon</a></li>
            <li><a class="dropdown-item" href="#">The Enchantments</a></li>
            <li><a class="dropdown-item" href="#">Denali</a></li>
            <li><a class="dropdown-item" href="#">Grand Teton</a></li>
            <li><a class="dropdown-item" href="#">Half Dome</a></li>
            <li><hr class="dropdown-divider"></li>
            <li>
              <input class="form-control" type="file" id="file-selector" accept=".gmd">
            </li>
          </ul>
        </li>
        <li class="nav-item navbar-text" id="model_name">
          Mount Rainier
        </li>
        <li class="nav-item">
          <button id="render" class="btn btn-light" style="margin-left: 5px;"><img height="25" src="assets/camera.svg"></button>
        </li>
      </ul>
    </div>
  
    <div id="loading-spinner" class="spinner-border text-primary" role="status"></div>
    <label for="loading-spinner" id="loading-status">Loading...</label>
  
  </div>
</nav>

<div id="canvas-container" class="flex-grow-1">  
<!-- <div id="canvas-container">   -->

</div>

</div>

<canvas 
id="gl-canvas" 
style="
  background-color: black; 
  touch-action: none; 
  display: block; 
  /* width: 100%; 
  height: 100%; */
  position: absolute;
  top: 0;
  left: 0;
"
></canvas>

<div>
  <div class="modal fade" id="settings_modal" tabindex="-1" role="dialog" aria-labelledby="exampleModalLabel" aria-hidden="true">
      <div class="modal-dialog modal-xl" role="document">
          <div class="modal-content">
              <div class="modal-header">
                  <h5 class="modal-title" id="exampleModalLabel">Settings</h5>
                  <button type="button" class="btn-close" data-dismiss="modal" aria-label="Close"></button>
              </div>
              <div class="modal-body d-flex flex-column" id="inputs">
              </div>
              <div class="modal-footer">
                  <button type="button" class="btn btn-secondary">Reset</button>
                  <button type="button" class="btn btn-primary" data-dismiss="modal">Close</button>
              </div>
          </div>
      </div>
  </div>
</div>

<div>
  <div class="modal fade" id="map_modal" tabindex="-1" role="dialog" aria-labelledby="mapModalLabel" aria-hidden="true">
      <div class="modal-dialog modal-xl" role="document">
          <div class="modal-content">
              <div class="modal-header">
                  <h5 class="modal-title" id="mapModalLabel">Map</h5>
                  <button type="button" class="btn-close" data-dismiss="modal" aria-label="Close"></button>
              </div>
              <div class="modal-body d-flex flex-column">


              <main class="main-grid">
                  <div class="map-area">
                      <p><strong>Left-click and drag</strong> to select a region • <strong>Right-click and drag</strong> to pan the map</p>
                      <div class="map-container">
                          <div class="map" id="map_div"></div>
                      </div>
                  </div>

                  <div class="controls-area">
                      <div class="control-group">
                          <label for="datasetSelect">Elevation Dataset:</label>
                          <select id="datasetSelect">
                              <option value="SRTMGL3">SRTM GL3 (Global 90m)</option>
                              <option value="SRTMGL1">SRTM GL1 (Global 30m)</option>
                              <option value="ALOS">ALOS World 3D (30m)</option>
                              <option value="SRTM15Plus">SRTM15+ V2.1 (Global 500m)</option>
                              <option value="GEBCO">GEBCO (Global Bathymetry 500m)</option>
                              <option value="COP30">Copernicus DEM GLO-30 (30m)</option>
                              <option value="COP90">Copernicus DEM GLO-90 (90m)</option>
                          </select>
                      </div>

                      <div class="control-group">
                          <button class="btn btn-success" id="fetchElevationBtn">Get Elevation Data</button>
                          <div class="status-message" id="statusMessage"></div>
                      </div>

                  </div>
              </main>


              </div>
              <div class="modal-footer">
                  <button type="button" class="btn btn-secondary">Reset</button>
                  <button type="button" class="btn btn-primary" data-dismiss="modal">Close</button>
              </div>
          </div>
      </div>
  </div>
</div>

<a id="png-download" display="none"></a>

</body>

</html>
